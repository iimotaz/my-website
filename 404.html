<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#090909" />
  <title>404 — Motaz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090909'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23F97316' font-family='Arial' font-weight='bold'>M</text></svg>" />
  <style>
    @font-face { font-family: "ITF Qomra Arabic"; font-style: normal; font-display: swap; font-weight: 400; src: url("./assets/fonts/itfQomraArabic-Regular.woff2") format("woff2"); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "ITF Qomra Arabic", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #090909;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #F1F5F9 0%, #F97316 40%, #FB923C 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    p { color: #94A3B8; font-size: 1.1rem; margin: 16px 0 28px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 30px;
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(135deg, #F97316, #FB923C);
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
      transition: box-shadow 0.25s, transform 0.25s;
    }
    a:hover { box-shadow: 0 12px 36px rgba(249, 115, 22, 0.55); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p data-i18n="msg">This page doesn't exist. Let's get you back.</p>
    <a href="index.html" data-i18n="btn">Back to Portfolio</a>
  </div>

  <script>
    (function() {
      var lang = localStorage.getItem("motaz-lang") || "en";
      var TR = {
        msg: { en: "This page doesn't exist. Let's get you back.", ar: "هذه الصفحة غير موجودة. دعنا نعيدك." },
        btn: { en: "Back to Portfolio", ar: "العودة إلى المعرض" }
      };
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = lang === "ar" ? "404 — Motaz" : "404 — Motaz";
      document.querySelectorAll("[data-i18n]").forEach(function(el) {
        var key = el.dataset.i18n;
        if (TR[key]) el.textContent = TR[key][lang] || TR[key].en;
      });
    })();
  </script>
</body>
</html>
